# Kubernetes workload manifest for the AKS 3-node / 6-pod lab.
# The deployment PowerShell script substitutes __IMAGE__ before applying this file.
#
# Why StatefulSet instead of Deployment?
# The exercise requires a stable Pod sequence number.
# StatefulSet gives deterministic Pod names:
# demo-web-0 ... demo-web-5.
#
# Availability Zones are intentionally NOT used in this lab.
# Pods are spread across the three AKS nodes using:
# topologyKey: kubernetes.io/hostname

apiVersion: v1
kind: Namespace
metadata:
  name: aks-web-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-landing
  namespace: aks-web-lab
data:
  entrypoint.sh: |
    #!/bin/sh
    set -eu

    POD_SEQUENCE=$(echo "$POD_NAME" | sed 's/.*-//')

    cat > /usr/share/nginx/html/index.html <<HTML
    <!doctype html>
    <html>
    <head>
      <meta charset="utf-8">
      <title>AKS 3-Node / 6-Pod Demo</title>
      <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 60px auto; padding: 30px; background: #f5f7fa; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.12); }
        h1 { margin-top: 0; }
        .value { font-family: monospace; font-size: 1.1rem; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>AKS 3-Node / 6-Pod Demo</h1>
        <p><strong>Pod Sequence:</strong> <span class="value">$POD_SEQUENCE</span></p>
        <p><strong>Pod Name:</strong> <span class="value">$POD_NAME</span></p>
        <p><strong>Pod IP:</strong> <span class="value">$POD_IP</span></p>
        <p><strong>Node:</strong> <span class="value">$NODE_NAME</span></p>
        <p><strong>Image:</strong> <span class="value">__IMAGE__</span></p>
      </div>
    </body>
    </html>
    HTML

    exec nginx -g 'daemon off;'
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web-headless
  namespace: aks-web-lab
spec:
  clusterIP: None
  selector:
    app: demo-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-web
  namespace: aks-web-lab
spec:
  serviceName: demo-web-headless
  replicas: 6
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: demo-web
  template:
    metadata:
      labels:
        app: demo-web
    spec:
      containers:
        - name: nginx
          image: __IMAGE__
          imagePullPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - /scripts/entrypoint.sh
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: landing-script
              mountPath: /scripts
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: landing-script
          configMap:
            name: nginx-landing
            defaultMode: 0755
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: demo-web
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web
  namespace: aks-web-lab
spec:
  type: LoadBalancer
  selector:
    app: demo-web
  ports:
    - name: http
      port: 80
      targetPort: 80
